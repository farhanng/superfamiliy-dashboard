<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <meta name="description" content="SuperFamily Dashboard - PWA untuk keluarga Farhan & Inne">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SuperFamily">

  <title>SuperFamily Dashboard</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" sizes="any" href="/icons/icon-192.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <style>
    /* Critical CSS for fast first paint */
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: #F8FAFC;
      color: #1E293B;
    }
    .app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
    }
    .app-loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #E2E8F0;
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- App Container -->
  <div id="app">
    <!-- Loading State -->
    <div class="app-loading">
      <div class="app-loading-spinner"></div>
      <p style="color: #64748B; font-size: 14px;">Loading...</p>
    </div>
  </div>

  <!-- Main Script -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
